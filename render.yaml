services:
  - type: web
    name: vibe-coding-workshop
    runtime: node
    plan: free
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: workshop-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
