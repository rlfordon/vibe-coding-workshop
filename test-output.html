<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>window.react = window.React;</script>
<script src="https://unpkg.com/recharts@2.15.3/umd/Recharts.js" crossorigin></script>
<script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js" crossorigin></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; }
  #error-display { color: red; padding: 20px; font-family: monospace; white-space: pre-wrap; font-size: 13px; }
</style>
</head>
<body>
<div id="root"></div>
<div id="error-display"></div>
<script>
window.onerror = function(msg, url, line, col, err) {
  document.getElementById('error-display').textContent = 'Error: ' + msg + '\nLine: ' + line;
  return true;
};
</script>
<script type="text/babel" data-type="module">
const { useState, useEffect, useRef, useMemo, useCallback, useReducer, useContext, createContext, Fragment, memo, forwardRef } = React;

const { Plus, Trash2, Clock, Briefcase, FileText, Calendar, PieChart: PieChartIcon, BarChart3, Scale, Upload, FileDown, AlertCircle, Search, Filter, Eye, EyeOff, ChevronDown, ChevronUp, X } = window.LucideReact || {};
const { PieChart, Pie, Cell, ResponsiveContainer, Tooltip, Sector } = window.Recharts || {};

const COLORS = ['#1e3a8a', '#1d4ed8', '#3b82f6', '#60a5fa', '#93c5fd', '#bfdbfe', '#94a3b8'];

const App = () => {
  const [entries, setEntries] = useState([]);
  const [showLog, setShowLog] = useState(true);

  return (
    <div className="min-h-screen bg-slate-50 p-8">
      <h1 className="text-2xl font-bold">Time Tracker Test</h1>
      <p className="mt-2">If you can see this, React + Babel + Tailwind are working.</p>
      <div className="mt-4 flex gap-2">
        <Scale size={24} className="text-blue-900" />
        <Plus size={24} className="text-green-600" />
        <span>Lucide icons work too!</span>
      </div>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
